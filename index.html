<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b2033">
  <title>峡谷直升机</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="hud-panel top-panel">
      <div class="brand-block">
        <p class="eyebrow">Helicopter Run</p>
        <h1>峡谷直升机</h1>
        <p class="subcopy">轻点空格键给直升机一个向上的推力，连续点按来微调起飞和飞行高度。</p>
        <div class="difficulty-panel" aria-label="难度选择">
          <span class="difficulty-label">难度</span>
          <div class="difficulty-options">
            <button type="button" class="difficulty-button" data-difficulty="easy">轻松</button>
            <button type="button" class="difficulty-button is-active" data-difficulty="normal">标准</button>
            <button type="button" class="difficulty-button" data-difficulty="hard">极限</button>
          </div>
        </div>
      </div>

      <div class="meters">
        <section class="meter-card" aria-label="当前里程">
          <p class="meter-label">当前里程</p>
          <div class="meter-dial">
            <div class="meter-rings"></div>
            <div class="meter-needle" id="currentNeedle"></div>
            <div class="meter-center">
              <span class="meter-value" id="currentDistance">0000</span>
              <span class="meter-unit">m</span>
            </div>
          </div>
        </section>

        <section class="meter-card" aria-label="历史最高里程">
          <p class="meter-label">历史最高</p>
          <div class="meter-dial meter-dial-best">
            <div class="meter-rings"></div>
            <div class="meter-needle" id="bestNeedle"></div>
            <div class="meter-center">
              <span class="meter-value" id="bestDistance">0000</span>
              <span class="meter-unit">m</span>
            </div>
          </div>
        </section>
      </div>
    </header>

    <section class="arena-panel">
      <canvas id="gameCanvas" aria-label="直升机飞行游戏画布"></canvas>

      <div class="overlay overlay-visible" id="startOverlay">
        <div class="overlay-card">
          <p class="overlay-kicker">Ready</p>
          <h2>轻点空格开始飞行</h2>
          <p>每按一次空格，直升机会获得一次上冲推力，连续点按可以细调飞行高度。</p>
          <p>不同难度对应不同峡谷宽度，越难可通行空间越窄。</p>
          <p class="overlay-foot">首次按下空格会同时启动背景音乐。</p>
        </div>
      </div>

      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-card overlay-card-danger">
          <p class="overlay-kicker">Crash</p>
          <h2>本局结束</h2>
          <p id="finalDistanceText">本局飞行 0 m</p>
          <p>按空格键立刻重开，再次点按来调整起飞高度。</p>
        </div>
      </div>

      <div class="corner-status">
        <span id="speedBadge">速度 0 km/h</span>
        <span id="statusBadge">等待起飞</span>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
